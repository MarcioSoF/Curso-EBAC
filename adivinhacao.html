<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Adivinhação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Jogo de Adivinhação</h1>
    <h2>O jogo:</h2>
    <p>Será gerado um número aleatório através de nosso sistema e, o seu objetivo é adivinhar o número sorteado.</p>
    <p>Você receberá dicas, se o número é maior ou menor que o digitado.
    </p>
    <p>Você terá dez chances até o acerto.</p>
    <input type="number" id="valor" placeholder="Digite seu palpite">
    <button id="botaoChutar">Chutar</button>
    <p id="dicasJogo"></p>
    <p id="tentativasRestantes"></p>

    <script src="script.js"></script>
</body>
</html>
